<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <style>
    body {
      background-image: url('/static/forgot.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .form-container {
      background: rgba(155, 234, 240, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      width: 400px;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 5px;
    }

    input, button {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #007BFF;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: green;
    }

    .back-link {
      text-align: center;
      margin-top: 10px;
    }

    .back-link a {
      color: #007BFF;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Register</h2>
  <form id="registerForm">
    <div class="form-group"><label>Name:</label><input type="text" name="name" required></div>
    <div class="form-group"><label>Username:</label><input type="text" name="username" required></div>
    <div class="form-group"><label>Email ID:</label><input type="email" name="email_id" required></div>
    <div class="form-group"><label>Mobile Number:</label><input type="text" name="mobile_number" required></div>
    <div class="form-group"><label>Date of Birth:</label><input type="date" name="dob" required></div>
    <div class="form-group"><label>Password:</label><input type="password" name="password" required></div>
    <button type="submit">Register</button>
  </form>

  <div id="message"></div>

  <div class="back-link">
    <a href="/login.html">Back to Login</a>
  </div>
</div>

<script>
  document.getElementById("registerForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const formData = new FormData(this);

    fetch("/register", {
      method: "POST",
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById("message").textContent = data.message;
    });
  });
</script>

</body>
</html>
